# Optional: เข้าสู่ระบบด้วย Provider ID straight against MOPH ID and Provider ID (docs/runbooks/provider-sso.md).
# Add this file after the production or staging files. Without it the button stays hidden.
services:
  web:
    environment:
      PROVIDER_ID_ENV: ${PROVIDER_ID_ENV:-prd}
      PROVIDER_ID_HEALTH_CLIENT_ID: ${PROVIDER_ID_HEALTH_CLIENT_ID:?set PROVIDER_ID_HEALTH_CLIENT_ID}
      PROVIDER_ID_CLIENT_ID: ${PROVIDER_ID_CLIENT_ID:?set PROVIDER_ID_CLIENT_ID}
      PROVIDER_ID_REDIRECT_URI: ${PROVIDER_ID_REDIRECT_URI:?set PROVIDER_ID_REDIRECT_URI}
      PROVIDER_ID_HEALTH_CLIENT_SECRET_FILE: /run/secrets/provider_id_health_client_secret
      PROVIDER_ID_SECRET_KEY_FILE: /run/secrets/provider_id_secret_key
      # With Provider ID ready, username-and-password sign-in is closed. PASSWORD_SIGN_IN=on is the break-glass (docs/runbooks/provider-sso.md).
      PASSWORD_SIGN_IN: ${PASSWORD_SIGN_IN:-}
      # The radius-server portal asks for profile photos (GET /api/portal/photo) with requests it signs; web checks them against the
      # portal's JWKS. Only the portal issuer and the audience (backoffice) are needed, never a portal secret.
      PROVIDER_SSO_ISSUER: ${PROVIDER_SSO_ISSUER:-https://aut-waritch-hosp.moph.go.th}
      PROVIDER_SSO_CLIENT_ID: ${PROVIDER_SSO_CLIENT_ID:-backoffice}
    # The portal answers only inside the hospital, so its name is pinned to the LAN address instead of relying on DNS in Docker.
    extra_hosts:
      - "${PROVIDER_SSO_PORTAL_HOST:-aut-waritch-hosp.moph.go.th}:${PROVIDER_SSO_PORTAL_IP:-192.168.1.10}"
    secrets: [provider_id_health_client_secret, provider_id_secret_key]
    # The web container calls moph.id.th and provider.id.th itself; the other networks are internal.
    networks: [egress]

networks:
  egress:
    # Pinned like the other staging networks: Docker's own pick can overlap the hospital client network (172.18.0.0/16).
    ipam:
      config:
        - subnet: ${BACKOFFICE_EGRESS_SUBNET:?set BACKOFFICE_EGRESS_SUBNET}

secrets:
  provider_id_health_client_secret:
    file: ${PROVIDER_ID_HEALTH_CLIENT_SECRET_FILE:?set PROVIDER_ID_HEALTH_CLIENT_SECRET_FILE}
  provider_id_secret_key:
    file: ${PROVIDER_ID_SECRET_KEY_FILE:?set PROVIDER_ID_SECRET_KEY_FILE}
