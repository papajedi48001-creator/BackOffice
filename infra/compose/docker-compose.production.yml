services:
  caddy:
    image: ${CADDY_IMAGE:?set CADDY_IMAGE}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge, backplane]
    depends_on:
      web:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      DATABASE_URL_FILE: /run/secrets/database_url
      BACKOFFICE_SESSION_SECRET_FILE: /run/secrets/session_secret
      NATIONAL_ID_ENCRYPTION_KEY_FILE: /run/secrets/national_id_encryption_key
      NATIONAL_ID_LOOKUP_KEY_FILE: /run/secrets/national_id_lookup_key
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY_ID_FILE: /run/secrets/s3_access_key_id
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_secret_access_key
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      REDIS_URL: redis://redis:6379
    secrets: [database_url, session_secret, national_id_encryption_key, national_id_lookup_key, s3_access_key_id, s3_secret_access_key]
    networks: [backplane]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: ${WORKER_IMAGE:?set WORKER_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL: redis://redis:6379
    secrets: [database_url]
    networks: [backplane]

  mariadb:
    image: ${MARIADB_IMAGE:?set MARIADB_IMAGE}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?set MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER:?set MARIADB_USER}
      MARIADB_PASSWORD_FILE: /run/secrets/mariadb_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
    secrets: [mariadb_password, mariadb_root_password]
    volumes: [mariadb-data:/var/lib/mysql]
    networks: [backplane]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 --silent"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:?set REDIS_IMAGE}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    networks: [backplane]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ไฟล์แนบส่วนตัว (SeaweedFS, Apache 2.0). The S3 identities file holds the same keys the web app reads.
  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:?set SEAWEEDFS_IMAGE}
    restart: unless-stopped
    command: ["server", "-dir=/data", "-volume.max=0", "-master.volumeSizeLimitMB=1024", "-s3", "-s3.port=8333", "-s3.config=/run/secrets/seaweedfs_s3_config"]
    secrets: [seaweedfs_s3_config]
    volumes: [seaweedfs-data:/data]
    networks: [backplane]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Scans every upload before it is stored. freshclam needs outbound HTTPS (or a local mirror) for signatures.
  clamav:
    image: ${CLAMAV_IMAGE:?set CLAMAV_IMAGE}
    restart: unless-stopped
    volumes: [clamav-data:/var/lib/clamav]
    networks: [backplane, updates]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s

networks:
  edge: {}
  backplane:
    internal: true
  updates: {}

volumes:
  caddy-data: {}
  caddy-config: {}
  mariadb-data: {}
  redis-data: {}
  seaweedfs-data: {}
  clamav-data: {}

secrets:
  database_url:
    file: ${DATABASE_URL_FILE:?set DATABASE_URL_FILE}
  session_secret:
    file: ${BACKOFFICE_SESSION_SECRET_FILE:?set BACKOFFICE_SESSION_SECRET_FILE}
  national_id_encryption_key:
    file: ${NATIONAL_ID_ENCRYPTION_KEY_FILE:?set NATIONAL_ID_ENCRYPTION_KEY_FILE}
  national_id_lookup_key:
    file: ${NATIONAL_ID_LOOKUP_KEY_FILE:?set NATIONAL_ID_LOOKUP_KEY_FILE}
  mariadb_password:
    file: ${MARIADB_PASSWORD_FILE:?set MARIADB_PASSWORD_FILE}
  mariadb_root_password:
    file: ${MARIADB_ROOT_PASSWORD_FILE:?set MARIADB_ROOT_PASSWORD_FILE}
  s3_access_key_id:
    file: ${S3_ACCESS_KEY_ID_FILE:?set S3_ACCESS_KEY_ID_FILE}
  s3_secret_access_key:
    file: ${S3_SECRET_ACCESS_KEY_FILE:?set S3_SECRET_ACCESS_KEY_FILE}
  seaweedfs_s3_config:
    file: ${SEAWEEDFS_S3_CONFIG_FILE:?set SEAWEEDFS_S3_CONFIG_FILE}
