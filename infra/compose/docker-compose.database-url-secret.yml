# Optional: keep the database URL in an operator-managed secret file instead of the first-run setup volume.
# With this override the setup page never opens, because DATABASE_URL_FILE is set.
services:
  web:
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
  worker:
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]

secrets:
  database_url:
    file: ${DATABASE_URL_FILE:?set DATABASE_URL_FILE}
