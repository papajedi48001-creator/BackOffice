services:
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: backoffice
      MARIADB_USER: backoffice
      MARIADB_PASSWORD: local-development-only
      MARIADB_ROOT_PASSWORD: local-root-development-only
    ports: ["3307:3306"]
    volumes: ["mariadb-data:/var/lib/mysql"]
  redis:
    image: redis:8.4-alpine
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: local-minio-admin
      MINIO_ROOT_PASSWORD: local-minio-development-only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
volumes:
  mariadb-data:
  redis-data:
  minio-data:
