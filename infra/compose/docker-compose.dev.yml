services:
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: backoffice
      MARIADB_USER: backoffice
      MARIADB_PASSWORD: local-development-only
      MARIADB_ROOT_PASSWORD: local-root-development-only
    ports: ["${BACKOFFICE_DB_PORT:-3307}:3306"]
    volumes: ["mariadb-data:/var/lib/mysql"]
  redis:
    image: redis:8.4-alpine
    ports: ["${BACKOFFICE_REDIS_PORT:-6379}:6379"]
    volumes: ["redis-data:/data"]
  # ไฟล์แนบส่วนตัว: S3-compatible object storage (Apache 2.0). Keys come from seaweedfs-dev-s3.json.
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-volume.max=0", "-master.volumeSizeLimitMB=1024", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports: ["${BACKOFFICE_S3_PORT:-8333}:8333"]
    volumes: ["seaweedfs-data:/data", "./seaweedfs-dev-s3.json:/etc/seaweedfs/s3.json:ro"]
  # Virus scanner for uploads. Downloads signatures on first start and needs about 3 GB of RAM;
  # start it with `node scripts/setup-local.mjs --with-clamav`.
  clamav:
    image: clamav/clamav:1.4
    ports: ["${BACKOFFICE_CLAMAV_PORT:-3310}:3310"]
    volumes: ["clamav-data:/var/lib/clamav"]
  # Optional: serves the web app running on the host over HTTPS to other machines on the LAN.
  # See docs/runbooks/local-setup.md.
  https-lan:
    image: caddy:2.8
    profiles: ["lan"]
    environment:
      BACKOFFICE_LAN_HOST: ${BACKOFFICE_LAN_HOST:-localhost}
      BACKOFFICE_WEB_PORT: ${BACKOFFICE_WEB_PORT:-3000}
    ports: ["${BACKOFFICE_LAN_PORT:-8443}:8443"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./Caddyfile.lan:/etc/caddy/Caddyfile:ro", "caddy-lan-data:/data"]
volumes:
  mariadb-data:
  redis-data:
  seaweedfs-data:
  clamav-data:
  caddy-lan-data:
