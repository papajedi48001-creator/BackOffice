# Optional: show Back Office profile photos on the radius-server portal dashboard (docs/runbooks/provider-sso.md, section 4).
# Add this file after docker-compose.provider-sso.yml. Without it /api/portal/photo answers 404.
services:
  web:
    environment:
      # Only the portal issuer (for its JWKS) and the audience it signs photo requests for; no portal secret is needed.
      PROVIDER_SSO_ISSUER: ${PROVIDER_SSO_ISSUER:?set PROVIDER_SSO_ISSUER}
      PROVIDER_SSO_CLIENT_ID: ${PROVIDER_SSO_CLIENT_ID:-backoffice}
    # The portal answers only inside the hospital, so its name is pinned to the LAN address instead of relying on DNS in Docker.
    extra_hosts:
      - "${PROVIDER_SSO_PORTAL_HOST:-aut-waritch-hosp.moph.go.th}:${PROVIDER_SSO_PORTAL_IP:-192.168.1.10}"
